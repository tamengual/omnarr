<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" role="img"><title>How Omnarr fits in</title><desc>You use Omnarr, which reads and plays from your library apps (movies and TV, books, comics, games). Requests go from Omnarr to request apps, then indexers, then a download client, which delivers files into the libraries.</desc><style>
  .t { font: 500 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .box rect { fill: #F1EFE8; stroke: #888780; } .box .t { fill: #2C2C2A; } .box .s { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .t { fill: #085041; } .teal .s { fill: #0F6E56; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .t { fill: #712B13; } .coral .s { fill: #993C1D; }
  .legend { fill: #5F5E5A; }
  .line { stroke: #888780; } .line-teal { stroke: #1D9E75; } .line-coral { stroke: #D85A30; }
  #ah-gray path { stroke: #888780; } #ah-teal path { stroke: #1D9E75; } #ah-coral path { stroke: #D85A30; }
  @media (prefers-color-scheme: dark) {
    .box rect { fill: #2C2C2A; stroke: #888780; } .box .t { fill: #F1EFE8; } .box .s { fill: #B4B2A9; }
    .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .t { fill: #E1F5EE; } .teal .s { fill: #9FE1CB; }
    .coral rect { fill: #712B13; stroke: #F0997B; } .coral .t { fill: #FAECE7; } .coral .s { fill: #F5C4B3; }
    .legend { fill: #B4B2A9; }
    .line { stroke: #B4B2A9; } #ah-gray path { stroke: #B4B2A9; }
  }
</style><defs><marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="box"><rect x="230" y="20" width="220" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="38" text-anchor="middle" dominant-baseline="central">You</text><text class="s" x="340.0" y="58" text-anchor="middle" dominant-baseline="central">Browser, phone, HA sidebar</text></g><path d="M340 76 V106" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="coral"><rect x="200" y="110" width="280" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="128" text-anchor="middle" dominant-baseline="central">Omnarr</text><text class="s" x="340.0" y="148" text-anchor="middle" dominant-baseline="central">One search, request, play</text></g><path d="M340 166 V196 H115 V226" class="line-teal" fill="none" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah-teal)"/><path d="M340 166 V196 H265 V226" class="line-teal" fill="none" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah-teal)"/><path d="M340 166 V196 H415 V226" class="line-teal" fill="none" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah-teal)"/><path d="M340 166 V196 H565 V226" class="line-teal" fill="none" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah-teal)"/><g class="teal"><rect x="50" y="230" width="130" height="72" rx="8" stroke-width="0.75"/><text class="t" x="115.0" y="250" text-anchor="middle" dominant-baseline="central">Movies and TV</text><text class="s" x="115.0" y="270" text-anchor="middle" dominant-baseline="central">Sonarr, Radarr</text><text class="s" x="115.0" y="287" text-anchor="middle" dominant-baseline="central">Jellyfin</text></g><g class="teal"><rect x="200" y="230" width="130" height="72" rx="8" stroke-width="0.75"/><text class="t" x="265.0" y="250" text-anchor="middle" dominant-baseline="central">Books</text><text class="s" x="265.0" y="270" text-anchor="middle" dominant-baseline="central">Calibre, ABS</text><text class="s" x="265.0" y="287" text-anchor="middle" dominant-baseline="central">Storyteller</text></g><g class="teal"><rect x="350" y="230" width="130" height="72" rx="8" stroke-width="0.75"/><text class="t" x="415.0" y="248" text-anchor="middle" dominant-baseline="central">Comics</text><text class="s" x="415.0" y="268" text-anchor="middle" dominant-baseline="central">Komga</text></g><g class="teal"><rect x="500" y="230" width="130" height="72" rx="8" stroke-width="0.75"/><text class="t" x="565.0" y="248" text-anchor="middle" dominant-baseline="central">Games</text><text class="s" x="565.0" y="268" text-anchor="middle" dominant-baseline="central">RomM</text></g><path d="M555 400 V345 H115 V306" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><path d="M555 400 V345 H265 V306" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><path d="M555 400 V345 H415 V306" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><path d="M555 400 V345 H565 V306" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><path d="M200 138 H25 V428 H41" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="box"><rect x="45" y="400" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="135.0" y="418" text-anchor="middle" dominant-baseline="central">Request apps</text><text class="s" x="135.0" y="438" text-anchor="middle" dominant-baseline="central">Seerr/Shelfmark/ROMarr</text></g><path d="M225 428 H251" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="box"><rect x="255" y="400" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="345.0" y="418" text-anchor="middle" dominant-baseline="central">Indexers</text><text class="s" x="345.0" y="438" text-anchor="middle" dominant-baseline="central">Prowlarr</text></g><path d="M435 428 H461" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="box"><rect x="465" y="400" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="555.0" y="418" text-anchor="middle" dominant-baseline="central">Download client</text><text class="s" x="555.0" y="438" text-anchor="middle" dominant-baseline="central">e.g. qBittorrent</text></g><line x1="60" y1="486" x2="90" y2="486" class="line-teal" stroke-width="1" stroke-dasharray="4 3"/><text class="s legend" x="98" y="486" dominant-baseline="central">Omnarr reads and plays</text><line x1="330" y1="486" x2="360" y2="486" class="line" stroke-width="1"/><text class="s legend" x="368" y="486" dominant-baseline="central">Requests and downloads</text></svg>
