<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>Example: read-alongs and position sync</title><desc>An ebook from Calibre and an audiobook from Audiobookshelf are paired, aligned by Storyteller into a read-along, and BookBridge keeps the position in sync across a Kobo, the Audiobookshelf app and the Storyteller app.</desc><style>
  .t { font: 500 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .box rect { fill: #F1EFE8; stroke: #888780; } .box .t { fill: #2C2C2A; } .box .s { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .t { fill: #085041; } .teal .s { fill: #0F6E56; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .t { fill: #712B13; } .coral .s { fill: #993C1D; }
  .legend { fill: #5F5E5A; }
  .line { stroke: #888780; } .line-teal { stroke: #1D9E75; } .line-coral { stroke: #D85A30; }
  #ah-gray path { stroke: #888780; } #ah-teal path { stroke: #1D9E75; } #ah-coral path { stroke: #D85A30; }
  @media (prefers-color-scheme: dark) {
    .box rect { fill: #2C2C2A; stroke: #888780; } .box .t { fill: #F1EFE8; } .box .s { fill: #B4B2A9; }
    .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .t { fill: #E1F5EE; } .teal .s { fill: #9FE1CB; }
    .coral rect { fill: #712B13; stroke: #F0997B; } .coral .t { fill: #FAECE7; } .coral .s { fill: #F5C4B3; }
    .legend { fill: #B4B2A9; }
    .line { stroke: #B4B2A9; } #ah-gray path { stroke: #B4B2A9; }
  }
</style><defs><marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="teal"><rect x="90" y="20" width="200" height="56" rx="8" stroke-width="0.75"/><text class="t" x="190.0" y="38" text-anchor="middle" dominant-baseline="central">Calibre</text><text class="s" x="190.0" y="58" text-anchor="middle" dominant-baseline="central">The ebook</text></g><g class="teal"><rect x="390" y="20" width="200" height="56" rx="8" stroke-width="0.75"/><text class="t" x="490.0" y="38" text-anchor="middle" dominant-baseline="central">Audiobookshelf</text><text class="s" x="490.0" y="58" text-anchor="middle" dominant-baseline="central">The audiobook</text></g><path d="M190 76 V100 H340 V124" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><path d="M490 76 V100 H340 V124" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="box"><rect x="230" y="128" width="220" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="146" text-anchor="middle" dominant-baseline="central">Pairing script</text><text class="s" x="340.0" y="166" text-anchor="middle" dominant-baseline="central">Matches ebook and audio</text></g><path d="M340 184 V210" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="teal"><rect x="230" y="214" width="220" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="232" text-anchor="middle" dominant-baseline="central">Storyteller</text><text class="s" x="340.0" y="252" text-anchor="middle" dominant-baseline="central">Aligns text to narration</text></g><path d="M340 270 V296" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="coral"><rect x="230" y="300" width="220" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="318" text-anchor="middle" dominant-baseline="central">BookBridge</text><text class="s" x="340.0" y="338" text-anchor="middle" dominant-baseline="central">Keeps positions in sync</text></g><path d="M340 360 V384 H135 V412" class="line-coral" fill="none" stroke-width="1" marker-start="url(#ah-coral)" marker-end="url(#ah-coral)"/><path d="M340 360 V412" class="line-coral" fill="none" stroke-width="1" marker-end="url(#ah-coral)"/><path d="M340 360 V384 H545 V412" class="line-coral" fill="none" stroke-width="1" marker-end="url(#ah-coral)"/><g class="box"><rect x="45" y="416" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="135.0" y="434" text-anchor="middle" dominant-baseline="central">Kobo</text><text class="s" x="135.0" y="454" text-anchor="middle" dominant-baseline="central">Reading position</text></g><g class="box"><rect x="250" y="416" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="434" text-anchor="middle" dominant-baseline="central">ABS app</text><text class="s" x="340.0" y="454" text-anchor="middle" dominant-baseline="central">Listening position</text></g><g class="box"><rect x="455" y="416" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="545.0" y="434" text-anchor="middle" dominant-baseline="central">Storyteller app</text><text class="s" x="545.0" y="454" text-anchor="middle" dominant-baseline="central">Read-along position</text></g></svg>
