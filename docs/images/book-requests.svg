<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>How a requested book arrives</title><desc>Omnarr keeps looking via Shelfmark, which picks a release; the download client fetches it. Ebooks and comics land in the ingest folder: Calibre-Web-Automated ingests ebooks, comic archives are moved to Komga. Audiobooks land in their own folder, which Audiobookshelf scans.</desc><style>
  .t { font: 500 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .s { font: 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .box rect { fill: #F1EFE8; stroke: #888780; } .box .t { fill: #2C2C2A; } .box .s { fill: #5F5E5A; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .t { fill: #085041; } .teal .s { fill: #0F6E56; }
  .coral rect { fill: #FAECE7; stroke: #993C1D; } .coral .t { fill: #712B13; } .coral .s { fill: #993C1D; }
  .legend { fill: #5F5E5A; }
  .line { stroke: #888780; } .line-teal { stroke: #1D9E75; } .line-coral { stroke: #D85A30; }
  #ah-gray path { stroke: #888780; } #ah-teal path { stroke: #1D9E75; } #ah-coral path { stroke: #D85A30; }
  @media (prefers-color-scheme: dark) {
    .box rect { fill: #2C2C2A; stroke: #888780; } .box .t { fill: #F1EFE8; } .box .s { fill: #B4B2A9; }
    .teal rect { fill: #085041; stroke: #5DCAA5; } .teal .t { fill: #E1F5EE; } .teal .s { fill: #9FE1CB; }
    .coral rect { fill: #712B13; stroke: #F0997B; } .coral .t { fill: #FAECE7; } .coral .s { fill: #F5C4B3; }
    .legend { fill: #B4B2A9; }
    .line { stroke: #B4B2A9; } #ah-gray path { stroke: #B4B2A9; }
  }
</style><defs><marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ah-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="coral"><rect x="230" y="20" width="220" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="38" text-anchor="middle" dominant-baseline="central">Omnarr</text><text class="s" x="340.0" y="58" text-anchor="middle" dominant-baseline="central">Keeps looking for a copy</text></g><path d="M340 76 V102" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="box"><rect x="230" y="106" width="220" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="124" text-anchor="middle" dominant-baseline="central">Shelfmark</text><text class="s" x="340.0" y="144" text-anchor="middle" dominant-baseline="central">Picks the best release</text></g><path d="M340 162 V188" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="box"><rect x="230" y="192" width="220" height="56" rx="8" stroke-width="0.75"/><text class="t" x="340.0" y="210" text-anchor="middle" dominant-baseline="central">Download client</text><text class="s" x="340.0" y="230" text-anchor="middle" dominant-baseline="central">e.g. qBittorrent</text></g><path d="M340 248 V272 H135 V296" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><path d="M340 248 V272 H555 V296" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="box"><rect x="45" y="300" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="135.0" y="318" text-anchor="middle" dominant-baseline="central">Ingest folder</text><text class="s" x="135.0" y="338" text-anchor="middle" dominant-baseline="central">Ebooks and comics</text></g><g class="box"><rect x="465" y="300" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="555.0" y="318" text-anchor="middle" dominant-baseline="central">Audiobook folder</text><text class="s" x="555.0" y="338" text-anchor="middle" dominant-baseline="central">Separate drop-off</text></g><path d="M135 356 V416" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><path d="M135 356 V386 H345 V416" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><path d="M555 356 V416" class="line" fill="none" stroke-width="1" marker-end="url(#ah-gray)"/><g class="teal"><rect x="45" y="420" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="135.0" y="438" text-anchor="middle" dominant-baseline="central">Calibre</text><text class="s" x="135.0" y="458" text-anchor="middle" dominant-baseline="central">CWA ingests ebooks</text></g><g class="teal"><rect x="255" y="420" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="345.0" y="438" text-anchor="middle" dominant-baseline="central">Komga</text><text class="s" x="345.0" y="458" text-anchor="middle" dominant-baseline="central">Comic archives moved</text></g><g class="teal"><rect x="465" y="420" width="180" height="56" rx="8" stroke-width="0.75"/><text class="t" x="555.0" y="438" text-anchor="middle" dominant-baseline="central">Audiobookshelf</text><text class="s" x="555.0" y="458" text-anchor="middle" dominant-baseline="central">Scans its folder</text></g></svg>
