# Built-in lists Omnarr ships with, so common book→screen adaptations and shared universes
# work out of the box. Your own config.yml entries are added on top (a universe with the same
# name as one here replaces it). Turn these off with `starter_lists: false` in config.yml.
# Entries only take effect when you actually have the matching items. Corrections welcome.

