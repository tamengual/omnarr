# Shared worlds: several series (and standalones) in one reading order.
# `order` = titles that take that exact position; `series` = series whose books follow, in the
# order the series are listed here (then by their own number).
universes:
  - name: Foundation Universe
    author: Isaac Asimov
    order: [The End of Eternity, "I, Robot", The Caves of Steel, The Naked Sun, The Robots of Dawn,
            Robots and Empire, The Currents of Space, "The Stars, Like Dust", Pebble in the Sky,
            Prelude to Foundation, Forward the Foundation, Foundation, Foundation and Empire,
            Second Foundation, Foundation's Edge, Foundation and Earth]
    series: [Robot, Galactic Empire, Foundation]

  - name: Middle-earth
    author: J. R. R. Tolkien
    order: [The Silmarillion, The Children of Húrin, The Hobbit, The Fellowship of the Ring,
            The Two Towers, The Return of the King, Unfinished Tales]
    series: [The Lord of the Rings, Middle-earth]

  - name: The Cosmere
    author: Brandon Sanderson
    order: [Elantris, "Mistborn: The Final Empire", The Final Empire, The Well of Ascension,
            The Hero of Ages, Warbreaker, The Way of Kings, The Alloy of Law, Words of Radiance,
            Shadows of Self, The Bands of Mourning, Oathbringer, Rhythm of War, The Lost Metal,
            Tress of the Emerald Sea, Yumi and the Nightmare Painter, The Sunlit Man, Wind and Truth]
    series: [Mistborn, The Stormlight Archive, Elantris, Warbreaker]

  - name: Dune
    author: Frank Herbert
    order: [Dune, Dune Messiah, Children of Dune, God Emperor of Dune, Heretics of Dune,
            "Chapterhouse: Dune", Chapterhouse Dune]
    series: [Dune, Dune Chronicles]

  - name: The Enderverse
    author: Orson Scott Card
    series: [Ender Quintet, The Ender Quintet, Ender's Saga, Ender Saga, Ender's Game, Ender's Shadow, Shadow, The Shadow Saga, The First Formic War, The Second Formic War]

  - name: Realm of the Elderlings
    author: Robin Hobb
    series: [The Farseer Trilogy, Farseer Trilogy, The Liveship Traders, Liveship Traders,
             The Tawny Man, Tawny Man, The Rain Wild Chronicles, Rain Wild Chronicles,
             Fitz and the Fool, The Fitz and the Fool Trilogy]

  - name: The Riftwar Cycle
    author: Raymond E. Feist
    series: [The Riftwar Saga, Riftwar Saga, The Empire Trilogy, Krondor's Sons, The Serpentwar Saga,
             The Riftwar Legacy, Legends of the Riftwar, Conclave of Shadows, The Darkwar Saga,
             The Demonwar Saga, The Chaoswar Saga]

  - name: Hainish Cycle
    author: Ursula K. Le Guin
    order: [Rocannon's World, Planet of Exile, City of Illusions, The Left Hand of Darkness,
            The Word for World Is Forest, The Dispossessed, Four Ways to Forgiveness, The Telling]
    series: [Hainish Cycle, Hainish]
